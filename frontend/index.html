<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Czujników</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Nawigacja -->
  <nav class="navbar">
    <h1>Sensor Dashboard</h1>
    <div class="nav-links">
      <a href="#">Dashboard</a>
      <a href="#sensors">Czujniki</a>
      <a href="#charts">Wykresy</a>
      <a href="#">Ustawienia</a>
    </div>
  </nav>
  <!-- Głwna zawartość -->
  <main>
    <!-- Sekcja Czujnikw -->
    <section id="sensors">
      <h2 class="section-title">Czujniki</h2>
      <div id="sensors"></div>
    </section>
    <!-- Sekcja Wykresw -->
    <section id="charts">
      <h2 class="section-title">Wykresy</h2>
      <div class="charts-container">
        <div class="sensor-card">
          <div class="sensor-title">Temperatura - ostatnie 24h</div>
          <canvas id="tempChart"></canvas>
        </div>
        <div class="sensor-card">
          <div class="sensor-title">Wilgotność - ostatnie 24h</div>
          <canvas id="humidityChart"></canvas>
        </div>
      </div>
    </section>
  </main>
  <!-- Stopka -->
  <footer class="footer">
    <p> 2026 Dashboard IoT  System monitorowania czujnikw</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
